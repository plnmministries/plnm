# Checks the church YouTube channel for the new Daily Word video and sends the app notification.
# Runs every 30 minutes (GitHub may delay a run by a few minutes). Needs two repository secrets:
#   SITE_URL     e.g. https://www.paralokanestham.in
#   CRON_SECRET  the same value set as CRON_SECRET on the Vercel project
name: App scheduler
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Sync daily prayers and send notifications
        run: |
          curl -sS --fail --max-time 60 -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" "${{ secrets.SITE_URL }}/api/app/cron"
